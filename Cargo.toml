[package]
name = "dprint-plugin-nix"
version = "0.1.0"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.102"
dprint-core = { version = "0.67.4", features = ["wasm"] }
nixfmt_rs = { version = "0.2.0", default-features = false }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[lib]
crate-type = ["lib", "cdylib"]

[workspace]
resolver = "2"
members = ["generate_json_schema"]
