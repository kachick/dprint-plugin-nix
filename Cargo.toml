[package]
name = "dprint-plugin-nix"
version = "0.1.0"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
license = "MPL-2.0"
publish = false
repository = "https://github.com/kachick/dprint-plugin-nix"
description = "dprint plugin for Nix formatting using nixfmt"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
schema = ["dep:schemars"]

[dependencies]
dprint-core = { version = "0.69.1", features = ["wasm"] }
# nixfmt_rs enables the "cli" feature by default, which pulls in native
# dependencies like mimalloc. Disable default features for the wasm target.
nixfmt_rs = { version = "0.5.0", default-features = false }
schemars = { version = "1.2.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[lib]
crate-type = ["lib", "cdylib"]
# Distributed only as a dprint WASM plugin with no public Rust API
doctest = false

[workspace]
resolver = "2"
members = ["crates/schemagen"]

# Optimization matching official dprint plugins.
# Do not use `wasm-opt`:
# 1. Official dprint plugins do not use wasm-opt in their build pipelines.
# 2. Historically, wasm-opt caused crashes (https://github.com/dprint/dprint/issues/79).
# 3. rustc release profile with LTO is enough for wasmtime execution.
[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"
