[package]
name = "dprint-plugin-nix"
version = "0.1.0"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/kachick/dprint-plugin-nix"
description = "dprint plugin for Nix formatting using nixfmt"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dprint-core = { version = "0.69.1", features = ["wasm"] }
nixfmt_rs = { version = "0.2.0", default-features = false }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[lib]
crate-type = ["lib", "cdylib"]
# Distributed only as a dprint WASM plugin with no public Rust API
doctest = false

[workspace]
resolver = "2"
members = ["crates/schemagen"]
